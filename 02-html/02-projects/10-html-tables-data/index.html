<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables Data</title>
</head>

<body>
    <table>
        <caption>Usuarios</caption>
        <thead>
            <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Edad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
