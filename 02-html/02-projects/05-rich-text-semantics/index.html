<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Rich Text Semantics</title>
</head>

<body>
    <p>Usamos <abbr title="HyperText Markup Language">HTML</abbr>.</p>
    <blockquote cite="https://example.com">
        <p>Cita larga con significado.</p>
    </blockquote>
    <p><cite>Fuente citada</cite></p>
    <p><time datetime="2025-01-01">1 de enero de 2025</time></p>
</body>

</html>
