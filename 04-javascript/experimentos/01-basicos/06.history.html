<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>


<a href="#" onclick="atras()">Volver atrás</a>

<br>
<a href="#" onclick="adelante()">Ir adelante</a>

<br>

<a href="#" onclick="aleatoria()">ir a la segunda página</a>



	<script>


		function atras(){
			window.history.back();
		}

		function adelante(){
			window.history.forward();
		}


		function aleatoria(){
			window.history.go(3);
		}

		//History
		//back(); = ir hacia atrás
		//forward(); = ir hacia adelante
		//go(); = ir hasta donde lo definamos en el parametro.

	</script>
	
</body>
</html>
