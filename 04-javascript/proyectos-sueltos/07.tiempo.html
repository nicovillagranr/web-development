<body>


<a onClick="pararIntervalo()">Parar intervalo</a>


<a onClick=""></a>


	<script>

		//setTimeout(): tiempo de retraso (en milisegundos) para la ejecución de una función



 function alerta(){
 	alert('Hola, me retrase 2 segundos!');
 }
 setTimeout(alerta,2000);



 	//setInterval(): tiempo de retraso (en milisegundos) para la ejecución de una función


 function alertaIntervalo(){
 	alert('Hola, aparezco cada 3 segundos!');
 }
 setInterval(alertaIntervalo,3000);



  // Se pueden detener estos tiempos

  //clearInterval()
  //claarTimeout()


  function pararIntervalo(){
  	clearInterval(alertaIntervalo);	
  }


	</script>
	
</body>
</html>
