<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dynamic Cards practica JavaScript">
  <title>Dynamic Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Dynamic Cards</h1>
      <p>Crea cards en vivo y elimina usando delegacion de eventos.</p>
    </header>
    <section class="panel grid">
      <div class="row">
        <input id="text" type="text" placeholder="Contenido de la card">
        <button id="add">Agregar</button>
      </div>
      <ul id="list" class="list"></ul>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
