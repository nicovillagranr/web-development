<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080510">
  <title>404 — Página no encontrada | Nicolás Villagrán</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">

  <!-- Aplicar tema antes del primer paint para evitar flash. Misma lógica que App.jsx:16-18 -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme:mode");
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = stored || (prefersLight ? "light" : "dark");
        if (theme === "light") document.documentElement.classList.add("light");
      } catch (e) { /* localStorage bloqueado: cae a dark por defecto */ }
    })();
  </script>

  <style>
    :root {
      --bg: #080510;
      --surface: rgba(15, 10, 28, 0.75);
      --border: rgba(255, 0, 119, 0.35);
      --text: #fff8fb;
      --text-muted: #c878a8;
      --accent: #ff0077;
      --accent-glow: rgba(255, 0, 119, 0.18);
      --emerald: #00e5ff;
    }

    html.light {
      --bg: #f0f6f8;
      --surface: rgba(255, 255, 255, 0.90);
      --border: rgba(26, 115, 232, 0.35);
      --text: #202124;
      --text-muted: #5f6368;
      --accent: #1a73e8;
      --accent-glow: rgba(26, 115, 232, 0.10);
      --emerald: #188038;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image:
        radial-gradient(ellipse at top left, var(--accent-glow), transparent 50%),
        radial-gradient(ellipse at bottom right, var(--accent-glow), transparent 50%);
    }

    main {
      max-width: 32rem;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .code {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(4rem, 15vw, 6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--emerald));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(1.25rem, 3vw, 1.5rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    a.home {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    a.home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    a.home:focus-visible {
      outline: 2px solid var(--emerald);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main role="main">
    <div class="code" aria-hidden="true">404</div>
    <h1>Página no encontrada</h1>
    <p>La URL que intentas visitar no existe o fue movida. Volvé al inicio y seguí explorando.</p>
    <a class="home" href="/">← Volver al inicio</a>
  </main>
</body>

</html>
