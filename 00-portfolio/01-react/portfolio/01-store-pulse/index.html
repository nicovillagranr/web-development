<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS no lee el manifest para el icono de la pantalla de inicio: usa este. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- viewport-fit=cover para que la barra inferior respete el área segura del
         iPhone; sin él la navegación queda debajo del indicador de inicio. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- El color de la barra del navegador. Dos, uno por tema: si se deja solo el
         indigo, en modo oscuro queda una franja brillante encima de una app oscura.
         El manifest no admite media queries, así que la pantalla de arranque de la
         PWA sigue siendo clara en los dos temas. -->
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121824" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Panel de métricas operativas de un local: rendimiento individual y de equipo, objetivos y evolución semanal."
    />
    <title>Store Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
