    "@context": "https://schema.org",

    "name": "Projex",
    "url": "https://nico-villagran.com/projex/",

      "@type": "ContactPoint",
      "contactType": "Customer Service",
      "email": "contact@projex.com"
    }
  }
  </script>

  <!--
    Sin preload/prefetch de imágenes: todas se importan desde los componentes,
    así que Vite las emite con hash (hero-BtSPU6qn.webp) y aquí no hay forma de

</head>
