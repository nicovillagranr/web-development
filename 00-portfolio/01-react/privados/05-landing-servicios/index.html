<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover deja que la página use la zona del notch y de la barra de
         gestos del iPhone; env(safe-area-inset-bottom) es lo que después evita que la
         barra fija de WhatsApp quede debajo de esa barra. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Prototipo con marca ficticia y número de WhatsApp de relleno: fuera de Google
         hasta que sea definitivo. Al publicarlo de verdad, se borra esta línea. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Mantenimiento y armado de PCs, creación de páginas web y diseño mecánico en SolidWorks. Cotiza sin costo por WhatsApp. Sitio de demostración."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Brío — PCs, páginas web y SolidWorks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
