<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inline Editor practica JavaScript">
  <title>Inline Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Inline Editor</h1>
      <p>Edita texto in-place con guardar y validacion minima.</p>
    </header>
    <section class="panel grid">
      <p id="editable" class="item">Haz click en editar para cambiar este texto en vivo.</p>
      <div class="row">
        <button id="edit">Editar</button>
        <button id="save" class="secondary">Guardar</button>
      </div>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
