<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Modal Notes practica JavaScript">
  <title>Modal Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Modal Notes</h1>
      <p>Abre modal para crear notas y renderizarlas en lista.</p>
    </header>
    <section class="panel grid">
      <button id="open">Nueva nota</button>
      <ul id="notes" class="list"></ul>
    </section>
    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-box grid">
        <h2>Nueva nota</h2>
        <input id="title" type="text" placeholder="Titulo">
        <textarea id="content" rows="3" placeholder="Contenido"></textarea>
        <div class="row">
          <button id="save">Guardar</button>
          <button id="close" class="secondary">Cerrar</button>
        </div>
      </div>
    </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
