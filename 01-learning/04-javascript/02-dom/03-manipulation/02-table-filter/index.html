<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Table Filter practica JavaScript">
  <title>Table Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Table Filter</h1>
      <p>Filtra filas de tabla por nombre o rol con input en tiempo real.</p>
    </header>
    <section class="panel grid">
      <input id="search" type="text" placeholder="Buscar por nombre, rol o ciudad">
      <table class="table">
        <thead><tr><th>Nombre</th><th>Rol</th><th>Ciudad</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
