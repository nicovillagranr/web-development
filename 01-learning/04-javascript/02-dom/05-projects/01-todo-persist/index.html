<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todo Persist practica JavaScript">
  <title>Todo Persist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Todo Persist</h1>
      <p>ToDo con localStorage, completar y eliminar.</p>
    </header>
    <section class="panel grid">
      <div class="row">
        <input id="todoInput" type="text" placeholder="Nueva tarea">
        <button id="todoAdd">Agregar</button>
      </div>
      <ul id="todoList" class="list"></ul>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
