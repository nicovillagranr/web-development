<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notes Search Tags practica JavaScript">
  <title>Notes Search Tags</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Notes Search Tags</h1>
      <p>Notas con busqueda por texto y filtro por tag.</p>
    </header>
    <section class="panel grid">
      <div class="grid grid-2">
        <input id="noteTitle" type="text" placeholder="Titulo">
        <input id="noteTag" type="text" placeholder="Tag">
      </div>
      <textarea id="noteBody" rows="3" placeholder="Contenido"></textarea>
      <button id="noteAdd">Guardar nota</button>
    </section>

    <section class="panel grid">
      <div class="grid grid-2">
        <input id="searchText" type="text" placeholder="Buscar texto">
        <input id="searchTag" type="text" placeholder="Filtrar tag">
      </div>
      <ul id="notesList" class="list"></ul>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
