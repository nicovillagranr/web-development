<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kanban Board practica JavaScript">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Kanban Board</h1>
      <p>Tablero simple con tareas movibles entre ToDo, Doing y Done.</p>
    </header>
    <section class="panel grid">
      <div class="row">
        <input id="taskInput" type="text" placeholder="Nueva tarea">
        <button id="addTask">Agregar</button>
      </div>
      <div class="columns">
        <div class="column" data-col="todo"><h3>ToDo</h3></div>
        <div class="column" data-col="doing"><h3>Doing</h3></div>
        <div class="column" data-col="done"><h3>Done</h3></div>
      </div>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
