<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Budget Tracker practica JavaScript">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Budget Tracker</h1>
      <p>Controla ingresos/gastos, saldo total y persistencia local.</p>
    </header>
    <section class="panel grid">
      <div class="grid grid-2">
        <input id="desc" type="text" placeholder="Descripcion">
        <input id="amount" type="number" placeholder="Monto">
      </div>
      <div class="row">
        <select id="type"><option value="income">Ingreso</option><option value="expense">Gasto</option></select>
        <button id="add">Agregar movimiento</button>
      </div>
      <div class="row">
        <span class="badge" id="income">Ingresos: 0</span>
        <span class="badge" id="expense">Gastos: 0</span>
        <span class="badge" id="balance">Saldo: 0</span>
      </div>
      <ul id="movements" class="list"></ul>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
