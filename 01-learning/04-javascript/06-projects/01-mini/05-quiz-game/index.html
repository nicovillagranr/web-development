<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz Game practica JavaScript">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">JavaScript Practice</p>
      <h1>Quiz Game</h1>
      <p>Quiz corto con puntaje final y reinicio.</p>
    </header>
    <section class="panel grid">
      <div id="question" class="item"></div>
      <div id="answers" class="grid"></div>
      <button id="restart" class="secondary">Reiniciar</button>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
